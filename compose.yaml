name: mdvai-lab

services:
  postgres:
    image: postgres:16-alpine
    container_name: mdvai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-model_data_verify_ai}
      POSTGRES_USER: ${POSTGRES_USER:-mdvai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mdvai_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/00-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pgdata:
